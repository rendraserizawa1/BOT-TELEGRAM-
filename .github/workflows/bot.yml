name: Run Telegram Bot

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: telegram-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Download data from private repo
        run: |
          git clone --depth 1 --branch ${{ secrets.GH_BRANCH }} https://x-access-token:${{ secrets.GH_STORAGE_TOKEN }}@github.com/${{ secrets.GH_USERNAME }}/${{ secrets.GH_REPO }}.git _data
          cp -r _data/harga_toko ./
          cp -r _data/data-storage ./data-storage
          cp -r _data/data ./data || true
          rm -rf _data

      - name: Start bot
        run: node index.js
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GEMINI_KEY2: ${{ secrets.GEMINI_KEY2 }}
          GEMINI_KEY3: ${{ secrets.GEMINI_KEY3 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_STORAGE_TOKEN }}
          GITHUB_USERNAME: ${{ secrets.GH_USERNAME }}
          GITHUB_REPO: ${{ secrets.GH_REPO }}
          GITHUB_BRANCH: ${{ secrets.GH_BRANCH }}
          ENCRYPT_PASSWORD: ${{ secrets.ENCRYPT_PASSWORD }}
          DASHBOARD_USER: ${{ secrets.DASHBOARD_USER }}
          DASHBOARD_PASS: ${{ secrets.DASHBOARD_PASS }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          PORT: ${{ secrets.PORT }}
          MAX_MEMBER: ${{ secrets.MAX_MEMBER }}